# ══════════════════════════════════════════════════════════════════════════════
# Company Profile — Defense BD Digest
#
# Edit this file to match your company. The AI scorer uses every field here
# to decide how relevant each news article or contract opportunity is to you.
# ══════════════════════════════════════════════════════════════════════════════

company:
  name: "Your Company Name"   # ← update

  description: >
    A small business specializing in Systems Integration and Engineering & R&D,
    delivering technical solutions to DoD, Intelligence Community, and SOCOM
    customers. Capabilities span platform integration, sensor fusion, digital
    engineering, model-based systems engineering (MBSE), and technical program
    management. Growing into autonomous systems / AI-ML, electronic warfare,
    and directed energy.

  # Current core capabilities — what you can bid on today
  capabilities:
    - Systems Integration
    - Engineering & R&D
    - Model-Based Systems Engineering (MBSE)
    - Digital Engineering
    - Systems Engineering & Technical Assistance (SETA)
    - Test & Evaluation (T&E)
    - C4ISR Integration
    - Sensor Fusion
    - Platform Integration
    - Technical Program Management

  # Strategic growth areas — opportunities here should score higher even if
  # they slightly stretch current capability
  future_growth_areas:
    - Autonomous Systems and AI/ML for defense applications
    - Electronic Warfare (EW) and Directed Energy (DE)
    - Digital Engineering and MBSE pipelines
    - Unmanned Systems (UAS / UGV / USV)
    - Counter-UAS (C-UAS)
    - AI-enabled ISR and decision support

  # Primary DoD / IC customers you pursue
  target_agencies:
    - Army (PEO C3T, AFC, DEVCOM, ARL)
    - Navy (NAVAIR, NAVSEA, ONR, PEO IWS)
    - Air Force / Space Force (AFRL, AFLCMC, PEO Digital)
    - Marine Corps (MCSC)
    - NSA
    - DIA
    - NGA
    - ODNI
    - SOCOM
    - JSOC
    - DARPA
    - MDA (Missile Defense Agency)
    - NRO

  contract_focus:
    # Set-aside types to pursue as PRIME
    eligible_set_asides:
      - Small Business (Total SB)
      - SDVOSB             # include if your company qualifies; remove if not
      - VOSB               # include if your company qualifies; remove if not

    # Set-aside types to flag as NOT eligible (will be noted in rationale)
    ineligible_set_asides:
      - 8(a)
      - HUBZone
      - WOSB
      - EDWOSB

    # Opportunity types to watch
    pursuit_types:
      - Small Business set-aside prime contracts
      - Subcontracting opportunities under large primes
      - SBIR / STTR Phase I and II
      - IDIQ / GWAC task orders (GSA OASIS+, CIO-SP4, SeaPort-NxG)
      - Other Transaction Authority (OTA)
      - Broad Agency Announcements (BAA)

  # NAICS codes that align with your capabilities
  naics_codes:
    - "541330"   # Engineering Services
    - "541715"   # R&D — Physical, Engineering & Life Sciences
    - "541512"   # Computer Systems Design Services
    - "541519"   # Other Computer Related Services
    - "541690"   # Other Scientific & Technical Consulting Services
    - "334511"   # Search, Detection, Navigation, Guidance Instruments
    - "517410"   # Satellite Telecommunications
    - "336411"   # Aircraft Manufacturing (UAS relevance)

