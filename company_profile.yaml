# ══════════════════════════════════════════════════════════════════════════════
# Company Profile — Defense BD Digest
#
# Edit this file to match your company. The AI scorer uses every field here
# to decide how relevant each news article or contract opportunity is to you.
# ══════════════════════════════════════════════════════════════════════════════

company:
  name: "[Your Company]"   # kept anonymous — update if desired

  description: >
    An early-stage small business (under $5M revenue, no special set-aside
    designation) headquartered in Huntsville, AL, with staff available in
    San Diego CA, Dayton OH, and the DC/Northern Virginia/Maryland corridor.
    Specializes in Systems Integration and Engineering & R&D with proven
    experience on Army High Energy Laser (HEL-D) programs and Army ISR data
    exploitation / sensor fusion. Primarily pursues subcontracting positions
    under large prime contractors and small-business prime contracts in the
    $1M–$10M range. Personnel hold active Secret and TS/SCI clearances,
    enabling work on classified programs. Holds GSA Schedule and SeaPort-NxG
    contract vehicles. Growing into autonomous systems / AI-ML, broader
    directed energy / EW, MBSE, and unmanned systems.

  # Current core capabilities — what you can bid on today
  capabilities:
    - High Energy Laser (HEL) systems engineering and T&E (HEL-D program)
    - Army ISR data exploitation and sensor fusion
    - Systems Integration
    - Engineering & R&D
    - C4ISR Integration
    - Sensor Fusion and Multi-INT exploitation
    - Platform Integration
    - Systems Engineering & Technical Assistance (SETA)
    - Test & Evaluation (T&E)
    - Model-Based Systems Engineering (MBSE)
    - Digital Engineering
    - Technical Program Management

  # Strategic growth areas — score higher even if capability slightly stretches
  future_growth_areas:
    - Directed Energy (DE) — expanding beyond HEL-D to other Army/Navy DE programs
    - Electronic Warfare (EW) — leveraging ISR and sensor expertise
    - Autonomous Systems and AI/ML — building on ISR exploitation background
    - Unmanned Systems (UAS / UGV / USV) and Counter-UAS (C-UAS)
    - TITAN / DCGS-A and next-gen Army ISR architecture
    - Digital Engineering and MBSE pipelines
    - AI-enabled ISR and automated target recognition

  # Primary DoD / IC customers — ranked by priority
  target_agencies:
    - Army (DEVCOM, ARL, PEO Aviation, AFC, PEO IEW&S, Redstone Arsenal)
    - Army Futures Command (AFC)
    - DARPA
    - MDA (Missile Defense Agency — Redstone Arsenal)
    - Air Force (AFRL, Wright-Patterson — Dayton presence)
    - Navy (NAVAIR, NAVSEA, ONR — SeaPort-NxG vehicle)
    - Marine Corps (MCSC)
    - NSA
    - DIA
    - NGA
    - SOCOM / JSOC
    - NRO

  # Office locations — used to prioritize local program office opportunities
  locations:
    primary: "Huntsville, AL (Redstone Arsenal corridor)"
    expanding_to:
      - "San Diego / Southern California (NAVWAR, SPAWAR)"
      - "Dayton, OH / Wright-Patterson (AFRL, AFLCMC)"
      - "DC / Northern Virginia / Maryland (Pentagon, IC corridor)"

  # Contract vehicles currently held
  contract_vehicles:
    - GSA Schedule (PSS / IT)
    - SeaPort-NxG (Navy professional services — prime vehicle)

  # Personnel clearance levels held
  personnel_clearances:
    - Secret
    - TS/SCI

  # Opportunity size filter — minimum worth tracking
  min_opportunity_value: "$1M"
  target_opportunity_range: "$1M – $10M (subcontracts and small primes)"

  contract_focus:
    # Set-aside types eligible to pursue as PRIME
    eligible_set_asides:
      - Small Business (Total SB)
      - Unrestricted (full and open — especially for subcontract positions)

    # Set-aside types NOT eligible as prime — flag for subcontracting angle only
    ineligible_set_asides:
      - SDVOSB
      - VOSB
      - 8(a)
      - HUBZone
      - WOSB
      - EDWOSB

    # Opportunity types to watch — in priority order
    pursuit_types:
      - Subcontracting under large prime contractors (PRIMARY near-term focus)
      - Small Business set-aside prime contracts ($1M–$10M)
      - SBIR / STTR Phase I and II (directed energy, ISR, autonomy)
      - SeaPort-NxG task orders (Navy/USMC engineering services)
      - GSA Schedule task orders
      - Other Transaction Authority (OTA) — rapid prototyping
      - Broad Agency Announcements (BAA) — DEVCOM, ARL, DARPA
      - Classified program subcontracts (TS/SCI billets)

  # Categories to EXCLUDE — never relevant, filter out before scoring
  exclude_categories:
    - Military healthcare / medical systems
    - Logistics and supply chain management
    - Facilities / MILCON / construction
    - Pure IT helpdesk and desktop support
    - Food service / base operations support

  # NAICS codes that align with your capabilities
  naics_codes:
    - "541330"   # Engineering Services
    - "541715"   # R&D — Physical, Engineering & Life Sciences
    - "541512"   # Computer Systems Design Services
    - "541519"   # Other Computer Related Services
    - "541690"   # Other Scientific & Technical Consulting Services
    - "334511"   # Search, Detection, Navigation, Guidance Instruments
    - "517410"   # Satellite Telecommunications
    - "336411"   # Aircraft Manufacturing (UAS relevance)

