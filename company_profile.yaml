# ══════════════════════════════════════════════════════════════════════════════
# Company Profile — Defense BD Digest
#
# Edit this file to match your company. The AI scorer uses every field here
# to decide how relevant each news article or contract opportunity is to you.
# ══════════════════════════════════════════════════════════════════════════════

company:
  name: "[Your Company]"   # kept anonymous — update if desired

  description: >
    An early-stage small business (under $5M revenue, no special set-aside
    designation) headquartered in Huntsville, AL, with staff available in
    San Diego CA, Dayton OH, and the DC/Northern Virginia/Maryland corridor.
    Specializes in Systems Integration and Engineering & R&D with proven
    experience on Army High Energy Laser (HEL-D) programs and Army ISR data
    exploitation / sensor fusion. Primarily pursues subcontracting positions
    under large prime contractors — most significantly Intuitive Research and
    Technology (IRT/IRTC), our primary teaming partner who invites us onto
    pursuits pre-award. Also pursues small-business prime contracts in the
    $1M–$10M range. Personnel hold active Secret and TS/SCI clearances,
    enabling work on classified programs. Holds GSA Schedule and SeaPort-NxG
    contract vehicles. Growing into autonomous systems / AI-ML, broader
    directed energy / EW, MBSE, and unmanned systems. Has demonstrated ISR
    SME capability to the DOJ/law enforcement intelligence community via
    word-of-mouth sourced opportunities.

  # Current core capabilities — what you can bid on today
  capabilities:
    - High Energy Laser (HEL) systems engineering and T&E (HEL-D program)
    - Army ISR data exploitation and sensor fusion
    - Systems Integration
    - Engineering & R&D
    - C4ISR Integration
    - Sensor Fusion and Multi-INT exploitation
    - Platform Integration
    - Systems Engineering & Technical Assistance (SETA)
    - Test & Evaluation (T&E)
    - Model-Based Systems Engineering (MBSE)
    - Digital Engineering
    - Technical Program Management

  # Specific technical depth within capability areas
  # The more specific the match, the higher the score should be
  technical_depth:
    directed_energy:
      - Lethality analysis and effects modeling (kill chain, target vulnerability)
      - High-power fiber laser architecture and power scaling
      - HEL system integration and T&E
    isr_exploitation:
      - SIGINT and ELINT signal processing and analysis
      - Multi-source data fusion and track correlation
      - ISR sensor integration and ground station architecture

  # Highest-priority named programs — items touching these score maximum
  priority_programs:
    - TITAN (Tactical Intel Targeting Access Node) — Army AFC ISR ground station
    - Project Linchpin — AFC AI-enabled targeting and decision support
    - HEL-D (High Energy Laser Demonstrator) — Army directed energy
    - DE-MSHORAD (Directed Energy Maneuver SHORAD)
    - Army G-2 ISR Task Force — ACTIVE WORK, recompete to watch
    - ISR Task Force Army G-2 — existing subcontract through IRT, recompete window
    - MSIC (Missile and Space Intelligence Center) — CGO has direct relationships
    - MDA (Missile Defense Agency) — CGO has direct relationships, Huntsville based
    - Army Futures Command Cross-Functional Teams
    - PEO IEW&S (Intelligence, Electronic Warfare & Sensors)
    - DEVCOM / ARL directed energy and ISR research

  # Active prime relationships — these companies bring us onto pursuits BEFORE award
  # If any of these primes win or are rumored to be pursuing something, flag it high
  primary_primes:
    - name: "Intuitive Research and Technology (IRT / IRTC)"
      notes: >
        Primary teaming partner. We are invited onto pursuits pre-award — if not
        invited before proposal submission, we are not brought in post-award.
        Watch for IRT/IRTC contract wins, FPDS awards, and news mentions as
        strong signals of potential sub opportunities. IRT also introduces us
        to adjacent customers (e.g., DOJ ISR work introduced via IRT).
      award_keywords: ["Intuitive Research", "IRTC", "IRT Huntsville"]

  # Contracts actively held — watch for recompete signals
  recompete_watch:
    - program: "Army G-2 ISR Task Force"
      notes: >
        Current active subcontract through IRT. Watch for any Sources Sought,
        RFI, or pre-solicitation notice from Army G-2 or DIA that matches ISR
        exploitation / task force support. Any recompete signal here is
        maximum priority — score 90+.
      watch_terms: ["Army G-2", "ISR Task Force", "G-2 intelligence", "Army intelligence exploitation"]

  # Adjacent markets we've proven we can play in
  adjacent_markets:
    - agency: "Department of Justice (DOJ)"
      capability: "ISR exploitation SME support"
      notes: >
        Prior near-win on DOJ ISR work sourced entirely via word-of-mouth
        through IRT. Provided senior SME experience. Path to DOJ work is
        through network (IRT relationship), not formal procurement channels.
        Score any DOJ intelligence-related work moderately (65-75) as a
        relationship-dependent opportunity.
    - agency: "Law enforcement intelligence community"
      capability: "ISR and signals intelligence consulting"
      notes: "FBI, DEA, NSD — ISR and SIGINT expertise has demonstrated value here."

  # The single ideal lead — calibrates what a 90+ score looks like
  ideal_lead: >
    An integration, prototyping, or ISR-related contract at Army Futures
    Command, Army G-2, MSIC, or MDA in Huntsville, AL — especially anything
    touching ISR exploitation, AI/ML targeting, or directed energy — in the
    $1M–$10M range. Programs like TITAN, Project Linchpin, DE-MSHORAD, HEL-D,
    or any AFC/G-2/MSIC prototyping OTA are the bullseye. A recompete signal
    on the ISR Task Force work (G-2) is maximum priority. A subcontract
    position under IRT on any of these programs is equally ideal.
    Pre-solicitation signals (Sources Sought, RFI, Industry Day) score higher
    than award notices — we need to be in the room before the RFP drops.

  # SBIR strategy
  sbir_strategy: >
    AI SME on staff is actively seeking SBIR submissions. Highest-priority
    SBIR topics: Army/DEVCOM AI for ISR, machine learning for targeting,
    autonomous sensor exploitation, MDA AI for missile defense, AFC AI/ML
    prototyping. Any open SBIR/STTR topic from Army, DEVCOM, MDA, or AFC
    touching AI, ISR, sensor fusion, or directed energy should score 80+.

  # CGO network — high-value relationship intelligence for scoring
  cgo_network:
    strong_connections:
      - "MSIC (Missile and Space Intelligence Center) — direct relationships"
      - "MDA (Missile Defense Agency) — direct relationships"
      - "ISR Task Force Army G-2 — established presence"
    events_attended:
      - "All Huntsville-area events (AUSA Redstone, NDIA Huntsville, AFCEA Huntsville)"
      - "Most Washington DC events (AUSA Annual, NDIA DC, AFCEA TechNet)"
      - "Some events elsewhere"
    notes: >
      Word-of-mouth and relationship-sourced opportunities are our most likely
      path to early pre-solicitation intel. Score any pre-solicitation notice
      (Sources Sought, RFI, Industry Day announcement) from MSIC, MDA, Army G-2,
      or AFC 10+ points higher than an equivalent formal solicitation — these
      are exactly the signals that arrive before GovWin has them.

  # Strategic growth areas — score higher even if capability slightly stretches
  future_growth_areas:
    - Directed Energy (DE) — expanding beyond HEL-D to Army and Navy DE programs
    - Electronic Warfare (EW) — leveraging ISR and sensor processing expertise
    - Autonomous Systems and AI/ML — building on ISR exploitation background
    - TITAN / next-gen Army ISR architecture
    - Project Linchpin and AI-enabled targeting
    - OTA / rapid prototyping at AFC and DEVCOM (new capability to develop)
    - Digital Engineering and MBSE pipelines

  # Primary DoD / IC customers — ranked by priority
  target_agencies:
    - Army G-2 / ISR Task Force (ACTIVE WORK — highest priority, recompete watch)
    - MSIC — Missile and Space Intelligence Center (CGO direct relationships)
    - MDA — Missile Defense Agency, Redstone Arsenal (CGO direct relationships)
    - Army Futures Command (AFC) — Huntsville HQ
    - Army (DEVCOM, ARL, PEO Aviation, AFC, PEO IEW&S, Redstone Arsenal)
    - DARPA
    - DOJ / Law enforcement IC (proven ISR SME path via IRT network)
    - Air Force (AFRL, Wright-Patterson — Dayton presence)
    - Navy (NAVAIR, NAVSEA, ONR — SeaPort-NxG vehicle)
    - Marine Corps (MCSC)
    - NSA
    - DIA
    - NGA
    - SOCOM / JSOC
    - NRO

  # Office locations — used to prioritize local program office opportunities
  locations:
    primary: "Huntsville, AL (Redstone Arsenal corridor)"
    expanding_to:
      - "San Diego / Southern California (NAVWAR, SPAWAR)"
      - "Dayton, OH / Wright-Patterson (AFRL, AFLCMC)"
      - "DC / Northern Virginia / Maryland (Pentagon, IC corridor)"

  # Contract vehicles currently held
  contract_vehicles:
    - GSA Schedule (PSS / IT)
    - SeaPort-NxG (Navy professional services — prime vehicle)

  # Personnel clearance levels held
  personnel_clearances:
    - Secret
    - TS/SCI

  # Opportunity size filter — minimum worth tracking
  min_opportunity_value: "$1M"
  target_opportunity_range: "$1M – $10M (subcontracts and small primes)"

  contract_focus:
    # Set-aside types eligible to pursue as PRIME
    eligible_set_asides:
      - Small Business (Total SB)
      - Unrestricted (full and open — especially for subcontract positions)

    # Set-aside types NOT eligible as prime — flag for subcontracting angle only
    ineligible_set_asides:
      - SDVOSB
      - VOSB
      - 8(a)
      - HUBZone
      - WOSB
      - EDWOSB

    # Opportunity types to watch — in priority order
    pursuit_types:
      - Subcontracting under large prime contractors (PRIMARY near-term focus)
      - Small Business set-aside prime contracts ($1M–$10M)
      - SBIR / STTR Phase I and II (directed energy, ISR, autonomy)
      - SeaPort-NxG task orders (Navy/USMC engineering services)
      - GSA Schedule task orders
      - Other Transaction Authority (OTA) — rapid prototyping
      - Broad Agency Announcements (BAA) — DEVCOM, ARL, DARPA
      - Classified program subcontracts (TS/SCI billets)

  # Categories to EXCLUDE — never relevant, score 0
  exclude_categories:
    - Military healthcare / medical systems
    - Logistics and supply chain management
    - Facilities / MILCON / construction
    - Pure IT helpdesk and desktop support
    - Food service / base operations support
    - Space and satellite programs (out of scope)

  # False positive patterns — items that LOOK relevant but aren't actionable
  # These should be capped at 50 even if keywords match
  scoring_penalties:
    - Congressional budget coverage and NDAA analysis without a specific program action
    - Generic "AI in defense" think pieces not tied to a named program or RFP
    - Large prime contract awards over $50M with no visible subcontracting opportunity described
    - Space, satellite, and launch programs
    - Broad defense policy or strategy articles without a procurement hook
    - International arms sales and FMS (Foreign Military Sales)

  # NAICS codes that align with your capabilities
  naics_codes:
    - "541330"   # Engineering Services
    - "541715"   # R&D — Physical, Engineering & Life Sciences
    - "541512"   # Computer Systems Design Services
    - "541519"   # Other Computer Related Services
    - "541690"   # Other Scientific & Technical Consulting Services
    - "334511"   # Search, Detection, Navigation, Guidance Instruments
    - "517410"   # Satellite Telecommunications
    - "336411"   # Aircraft Manufacturing (UAS relevance)

