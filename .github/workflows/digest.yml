name: Weekly Defense BD Digest

on:
  schedule:
    - cron: '0 17 * * *'   # Daily at 17:00 UTC (12 PM ET / 1 PM EDT)
  workflow_dispatch:        # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write           # Required to commit seen_items.json back to repo

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        run: python digest.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

          # ── Email: SMTP (recommended) ──────────────────────────────────────
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

          # ── Email: SendGrid (optional, used instead of SMTP if set) ────────
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          DIGEST_FROM_EMAIL: ${{ secrets.DIGEST_FROM_EMAIL }}

          # ── Recipients ────────────────────────────────────────────────────
          DIGEST_FROM_NAME: ${{ vars.DIGEST_FROM_NAME || 'Defense BD Digest' }}
          DIGEST_TO_EMAILS: ${{ secrets.DIGEST_TO_EMAILS }}

          # ── SAM.gov (optional) ────────────────────────────────────────────
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}

          # ── Tuning ────────────────────────────────────────────────────────
          # Haiku pre-filter thresholds — lenient, Opus enforces the real 75 bar
          MIN_NEWS_SCORE: ${{ vars.MIN_NEWS_SCORE || '50' }}
          MIN_OPPORTUNITY_SCORE: ${{ vars.MIN_OPPORTUNITY_SCORE || '55' }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS || '7' }}
          # Set to 'true' to skip deduplication (useful for testing)
          SKIP_DEDUP: ${{ vars.SKIP_DEDUP || 'false' }}

      - name: Save deduplication state
        if: success()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add seen_items.json
          git diff --staged --quiet || git commit -m "chore: update digest state [skip ci]"
          git push
